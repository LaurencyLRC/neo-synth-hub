    <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Touch devices lay the page out on a canvas 1 / MOBILE_SCALE times wider than the screen and the browser
      // scales it down to fit, which is what a browser page zoom of MOBILE_SCALE (65%) did before. Change the
      // number to resize the whole interface: 0.8 for larger, 0.5 for smaller. Desktop browsers ignore it.
      (function () {
        var MOBILE_SCALE = 0.65;
        var meta = document.getElementById("viewport-meta");
        var touch = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
        if (!meta || !touch) return;
        function apply() {
          var w = Math.round(window.screen.width / MOBILE_SCALE);
          meta.setAttribute("content", "width=" + w);
        }
        apply();
        window.addEventListener("orientationchange", function () {
          setTimeout(apply, 100);
        });
      })();
    </script>
